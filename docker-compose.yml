version: '3.8'

services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: cambodia-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cambodia-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  chromadb_data:
  redis_data:
