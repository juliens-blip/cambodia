# railway.toml - Configuration Railway
# Utilise Docker pour éviter les problèmes de nixpacks/mise

[build]
# Utiliser le Dockerfile au lieu de nixpacks
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Nombre de replicas
numReplicas = 1
# NE PAS utiliser startCommand - laisser le Dockerfile CMD gérer ça
# Le Dockerfile utilise start.sh qui interprète correctement $PORT

# Healthcheck
healthcheckPath = "/health"
healthcheckTimeout = 300

# Redémarrage automatique en cas de crash
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
