# railway.toml - Configuration Railway pour Streamlit
# Utilise Docker pour éviter les problèmes de nixpacks/mise

[build]
# Utiliser le Dockerfile
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Nombre de replicas
numReplicas = 1

# Healthcheck désactivé - Streamlit multipage a des problèmes avec les paths
# healthcheckPath = "/_stcore/health"
healthcheckTimeout = 300
startupDelaySeconds = 120

# Redémarrage automatique en cas de crash
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
