# railway.toml - Configuration Railway pour Streamlit
# Utilise Docker pour éviter les problèmes de nixpacks/mise

[build]
# Utiliser le Dockerfile
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Nombre de replicas
numReplicas = 1

# Healthcheck désactivé - Streamlit (PORT principal) n'a pas d'endpoint /health
# L'API (port 8000) a /health mais Railway check le PORT principal uniquement
# healthcheckPath = "/health"
healthcheckTimeout = 300
startupDelaySeconds = 300

# Redémarrage automatique en cas de crash
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
