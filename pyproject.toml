[tool.poetry]
name = "cambodia-agri-analytics"
version = "0.1.0"
description = "Multi-commodity analytics platform for Cashew and Rubber markets in Cambodia"
authors = ["Cambodia Agri Analytics Team"]
readme = "README.md"
packages = [{include = "app"}, {include = "dashboard"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
supabase = "^2.3.0"
chromadb = "^0.4.22"
httpx = "^0.26.0"
apscheduler = "^3.10.4"
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"
python-dotenv = "^1.0.0"
xmltodict = "^0.13.0"
pytesseract = "^0.3.10"
pdf2image = "^1.17.0"
Pillow = "^10.2.0"
pypdf = "^4.2.0"
streamlit = "^1.30.0"
plotly = "^5.18.0"
folium = "^0.15.1"
streamlit-folium = "^0.18.0"
pytz = "^2024.1"
numpy = "<2.0"
pytest = "^7.4.4"
pytest-asyncio = "^0.23.3"
pytest-cov = "^4.1.0"

[tool.poetry.group.dev.dependencies]
black = "^24.1.0"
ruff = "^0.1.14"
mypy = "^1.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
